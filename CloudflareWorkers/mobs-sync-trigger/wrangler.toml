# Cloudflare Worker: fires the MObs -> R2 sync on a schedule.
#
# GitHub Actions' own cron schedule for .github/workflows/mobs-sync.yml proved unreliable in
# practice -- it silently failed to fire on its own scheduled time slot on two consecutive days
# (2026-09-03 and 2026-09-04), with only manually-triggered runs ever actually completing.
# Cloudflare's Cron Triggers are backed by dedicated infrastructure and don't share that
# best-effort-scheduling problem for a low-traffic account, so this Worker does the one thing
# GitHub Actions couldn't be trusted to do reliably: fire on time. It does not reimplement any
# of the actual sync logic (still MObsSync, the .NET project two levels up) -- it just POSTs a
# workflow_dispatch to trigger that existing workflow.
#
# Deploy (from this directory): npx wrangler deploy
# Requires a secret first:      npx wrangler secret put GITHUB_PAT
#   (a fine-grained GitHub PAT scoped to ONLY the ArtTrail/TransitLab repo, with
#   "Actions: Read and write" permission -- nothing broader. Generate at
#   https://github.com/settings/personal-access-tokens/new)

name = "transitlab-mobs-sync-trigger"
main = "src/index.js"
compatibility_date = "2026-09-04"

[triggers]
# 15:00 UTC = ~8 AM Arizona (MST/UTC-7, where the Cecilia scope is). Chosen (2026-09-24) over the
# old 12:57 UTC so MicroObservatory has published last night's data before the sync runs, so the
# daily notification's "latest night" list actually reflects last night. Cron doesn't observe DST.
crons = ["0 15 * * *"]
