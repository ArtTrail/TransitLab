name: MObs → R2 Daily Sync

on:
  schedule:
    # ~7 AM MDT (UTC-6). Cron doesn't observe DST, so this drifts to ~6 AM MST-season.
    # Offset 3 minutes before the hour, not on it — GitHub's own docs warn that on-the-hour
    # schedules are the highest-load window for Actions and are more likely to be delayed.
    # The very first scheduled run (2026-09-03 13:00 UTC) never fired at all under '0 13 * * *'.
    - cron: '57 12 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run MObsSync
        working-directory: MObsSync
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: dotnet run -c Release
